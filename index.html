function build(){let h=`<section class="sc cover on"><div class="crest">👑</div><small>THE UNITED KINGDOM EDITION</small><h1>AANGI'S<br>PASSPORT</h1><p>A collection of little adventures, big memories, and beautiful moments.</p><div class="nm">AANGI SIROYA</div><small>Birthday Special • 2026</small><button class="btn" id="open">Open My Passport</button></section>`;
h+=`<section class="sc id"><div class="hd"><span>AANGI AIRWAYS • PERSONAL TRAVEL DOCUMENT</span><span>🇬🇧</span></div><div class="row"><label class="idp" id="idp"><input type="file" accept="image/*" aria-label="Add passport holder photo" hidden data-k="id" data-one="1">${S.p.id&&S.p.id[0]?`<img src="${S.p.id[0]}" alt="">`:'Tap to add<br>her photo'}</label><dl><dt>PASSPORT HOLDER</dt><dd>Aangi Siroya</dd><dt>CLASS</dt><dd>Main Character</dd><dt>DESTINATION</dt><dd>United Kingdom 🇬🇧</dd><dt>VALIDITY</dt><dd>Memories Never Expire</dd></dl></div><p style="margin-top:20px;font-style:italic;color:var(--burg)">Officially licensed to make unforgettable memories.</p><p style="font-size:15px">Happy Birthday, Aangi! ♡ Your passport is empty — fill it with pictures, thoughts and stories. This is a shared passport: anyone with the link can view and edit it. Your memories save to the cloud when connected. Offline drafts stay on this device until they sync. Download a backup anytime.</p><div class="mrz">P&lt;GBRSIROYA&lt;&lt;AANGI&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;<br>MEMORIES&lt;NEVER&lt;EXPIRE&lt;2026&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div><p style="font:11px system-ui;color:#8a7a6a">Not a real government document — a birthday travel journal.</p></section>`;
